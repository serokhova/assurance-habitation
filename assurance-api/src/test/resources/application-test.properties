# In-memory H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE;INIT=CREATE SCHEMA IF NOT EXISTS assurance\\;CREATE SCHEMA IF NOT EXISTS messaging
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=assurance
spring.jpa.show-sql=false

# Disable Artemis / JMS listener during automated tests
spring.jms.listener.auto-startup=false
spring.autoconfigure.exclude=org.springframework.boot.artemis.autoconfigure.ArtemisAutoConfiguration

spring.sql.init.mode=never

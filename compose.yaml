services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projet}
      POSTGRES_USER: ${POSTGRES_USER:-atelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier-local-uniquement}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  artemis:
    image: apache/activemq-artemis:2.42.0-alpine
    restart: unless-stopped
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-atelier}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-atelier-local-uniquement}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "127.0.0.1:${ARTEMIS_PORT:-61616}:61616"
      - "127.0.0.1:${ARTEMIS_CONSOLE_PORT:-8161}:8161"
    volumes:
      - artemis_data:/var/lib/artemis-instance
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 61616 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  assurance-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: assurance-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-projet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atelier}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atelier-local-uniquement}
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: ${ARTEMIS_USER:-atelier}
      SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-atelier-local-uniquement}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy

  audit-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: audit-consumer
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-projet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atelier}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atelier-local-uniquement}
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: ${ARTEMIS_USER:-atelier}
      SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-atelier-local-uniquement}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy

volumes:
  postgres_data:
  artemis_data:
